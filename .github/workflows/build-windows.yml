name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name FL-Studio-Time-Calculator --icon icon.ico
          --collect-submodules pyflp __main__.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FL-Studio-Time-Calculator-Windows-x64
          path: dist/FL-Studio-Time-Calculator.exe
          if-no-files-found: error
          retention-days: 30
