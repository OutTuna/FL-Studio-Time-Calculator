name: Build and Release Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name FL-Studio-Time-Calculator --icon icon.ico
          --collect-submodules pyflp __main__.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FL-Studio-Time-Calculator-Windows-x64
          path: dist/FL-Studio-Time-Calculator.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FL-Studio-Time-Calculator-Windows-x64
          path: release
      - name: Publish release
        shell: bash
        run: |
          printf 'Windows x64 build from commit %s.\n\nDownload the EXE below and launch it. Python is not required.\n' "$RELEASE_SHA" > release-notes.md
          gh release create "$RELEASE_TAG" \
            release/FL-Studio-Time-Calculator.exe \
            --target "$RELEASE_SHA" \
            --title "Windows build $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest
